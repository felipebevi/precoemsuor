services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: precoemsuor-web
    container_name: precoemsuor-web
    restart: unless-stopped
    # monta o economias.json do host (atualizado pelo cron via update-rates.sh)
    # por cima do que veio na imagem, para refletir as cotações sem rebuild.
    volumes:
      - ./economias.json:/usr/share/nginx/html/economias.json:ro
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"

      # ── HTTPS apex — precoemsuor.com.br (DNS direto → Let's Encrypt) ────
      - "traefik.http.routers.precoemsuor-apex.rule=Host(`precoemsuor.com.br`)"
      - "traefik.http.routers.precoemsuor-apex.entrypoints=websecure"
      - "traefik.http.routers.precoemsuor-apex.tls=true"
      - "traefik.http.routers.precoemsuor-apex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.precoemsuor-apex.service=precoemsuor"
      - "traefik.http.routers.precoemsuor-apex.middlewares=precoemsuor-headers@docker"

      # ── HTTPS www.precoemsuor.com.br (atrás do Cloudflare; CF SSL Full)─
      # Cloudflare termina o TLS na borda. Aqui no origin basta TLS habilitado;
      # o cert padrão do Traefik atende, sem precisar de Let's Encrypt para o www.
      - "traefik.http.routers.precoemsuor-www.rule=Host(`www.precoemsuor.com.br`)"
      - "traefik.http.routers.precoemsuor-www.entrypoints=websecure"
      - "traefik.http.routers.precoemsuor-www.tls=true"
      - "traefik.http.routers.precoemsuor-www.service=precoemsuor"
      - "traefik.http.routers.precoemsuor-www.middlewares=precoemsuor-www-redirect@docker"
      - "traefik.http.middlewares.precoemsuor-www-redirect.redirectregex.regex=^https://www\\.precoemsuor\\.com\\.br/(.*)"
      - "traefik.http.middlewares.precoemsuor-www-redirect.redirectregex.replacement=https://precoemsuor.com.br/$${1}"
      - "traefik.http.middlewares.precoemsuor-www-redirect.redirectregex.permanent=true"

      # ── HTTPS legado — precoemsuor.9ideias.com.br ───────────────────────
      - "traefik.http.routers.precoemsuor.rule=Host(`precoemsuor.9ideias.com.br`)"
      - "traefik.http.routers.precoemsuor.entrypoints=websecure"
      - "traefik.http.routers.precoemsuor.tls=true"
      - "traefik.http.routers.precoemsuor.tls.certresolver=letsencrypt"
      - "traefik.http.routers.precoemsuor.service=precoemsuor"
      - "traefik.http.routers.precoemsuor.middlewares=precoemsuor-headers@docker"

      # ── HTTP → HTTPS (todos os hosts) ───────────────────────────────────
      - "traefik.http.routers.precoemsuor-http.rule=Host(`precoemsuor.com.br`) || Host(`www.precoemsuor.com.br`) || Host(`precoemsuor.9ideias.com.br`)"
      - "traefik.http.routers.precoemsuor-http.entrypoints=web"
      - "traefik.http.routers.precoemsuor-http.middlewares=precoemsuor-https-redirect@docker"
      - "traefik.http.middlewares.precoemsuor-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.precoemsuor-https-redirect.redirectscheme.permanent=true"

      # ── Headers de segurança ────────────────────────────────────────
      # Permissions-Policy libera a câmera só p/ a própria origem (PWA precisa).
      - "traefik.http.middlewares.precoemsuor-headers.headers.customResponseHeaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.precoemsuor-headers.headers.customResponseHeaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.precoemsuor-headers.headers.customResponseHeaders.Referrer-Policy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.precoemsuor-headers.headers.customResponseHeaders.Permissions-Policy=camera=(self)"
      - "traefik.http.middlewares.precoemsuor-headers.headers.STSSeconds=63072000"
      - "traefik.http.middlewares.precoemsuor-headers.headers.STSIncludeSubdomains=true"

      # Porta interna do nginx
      - "traefik.http.services.precoemsuor.loadbalancer.server.port=80"

  # ───────────────────────────────────────────────────────────────────
  # Micro-serviço de coleta do APK de placas de combustível.
  # POST /coleta_apk            — adiciona ao JSONL local
  # GET  /coleta_apk_coleta     — devolve tudo + limpa
  # GET  /coleta_apk            — healthcheck (sem limpar)
  # Mesmo host precoemsuor.com.br, paths interceptados antes do nginx.
  # ───────────────────────────────────────────────────────────────────
  coleta:
    build:
      context: ./coleta_apk
    image: precoemsuor-coleta
    container_name: precoemsuor-coleta
    restart: unless-stopped
    volumes:
      - ./coleta_apk/data:/data
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"
      # Path-routing: maior prioridade que o router do nginx (que é só por Host).
      - "traefik.http.routers.precoemsuor-coleta.rule=(Host(`precoemsuor.com.br`) || Host(`www.precoemsuor.com.br`)) && (Path(`/coleta_apk`) || Path(`/coleta_apk_coleta`))"
      - "traefik.http.routers.precoemsuor-coleta.entrypoints=websecure"
      - "traefik.http.routers.precoemsuor-coleta.tls=true"
      - "traefik.http.routers.precoemsuor-coleta.tls.certresolver=letsencrypt"
      - "traefik.http.routers.precoemsuor-coleta.priority=100"
      - "traefik.http.services.precoemsuor-coleta.loadbalancer.server.port=3000"

networks:
  traefik_net:
    external: true
